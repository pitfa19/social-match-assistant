[project]
name = "social-match"
version = "0.2.0"
description = "MCP server that lets agents scrape, classify, index and search local community posts."
requires-python = ">=3.11"
dependencies = ["mcp>=1.27,<2", "httpx>=0.28", "pydantic>=2.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
social-match-mcp = "social_match.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["social_match*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
